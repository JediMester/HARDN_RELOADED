# profiles/server.conf — Server / VM profile
# Maximum security. No GUI assumptions. Suitable for production servers,
# VMs, headless machines, and cloud instances.

PROFILE_NAME="Server / VM"

# ── Kernel & sysctl ─────────────────────────────────────────────────────────
OPT_KERNEL_HARDEN=1
OPT_DISABLE_IPV6=1          # Disable IPv6 entirely (servers rarely need it)
OPT_ASLR=1
OPT_BPF_HARDEN=1
OPT_KPTR_RESTRICT=1
OPT_DMESG_RESTRICT=1
OPT_PERF_RESTRICT=1
OPT_TCP_HARDENING=1
OPT_ICMP_HARDENING=1

# ── Kernel module blacklisting ───────────────────────────────────────────────
OPT_MODULE_BLACKLIST=1
OPT_BLACKLIST_USB_STORAGE=1
OPT_BLACKLIST_FIREWIRE=1
OPT_BLACKLIST_RARE_PROTOCOLS=1
OPT_DISABLE_BINFMT_MISC=1
OPT_BLACKLIST_THUNDERBOLT=1

# ── Firewall & dynamic scanner blocker ──────────────────────────────────────
OPT_FIREWALL=1
OPT_DFR_FWD=1
OPT_ALLOW_STEAM_PORTS=0
OPT_ALLOW_GAME_PORTS=0
FIREWALL_ALLOW_HTTP=1       # May be needed for web servers; user can disable
FIREWALL_ALLOW_HTTPS=1
FIREWALL_ALLOW_SSH=1

# ── SSH ──────────────────────────────────────────────────────────────────────
OPT_SSH_HARDEN=1
SSH_PORT=719                # Non-default port reduces automated brute-force noise
SSH_PERMIT_ROOT_LOGIN="no"
SSH_PASSWORD_AUTH="no"      # Key-only — ensure keys are deployed before hardening
SSH_X11_FORWARDING="no"
SSH_TCP_FORWARDING="no"
SSH_AGENT_FORWARDING="no"
SSH_MAX_AUTH_TRIES=3
SSH_LOGIN_GRACE_TIME=30
SSH_LOG_LEVEL="VERBOSE"
SSH_CLIENT_ALIVE_INTERVAL=180
SSH_CLIENT_ALIVE_COUNT_MAX=0
SSH_MAX_SESSIONS=2

# ── PAM / auth ───────────────────────────────────────────────────────────────
OPT_PAM_PWQUALITY=1
OPT_DISABLE_CORE_DUMPS=1
PAM_MIN_PASSWORD_LEN=14
PAM_PASSWORD_RETRY=3

# ── Audit ────────────────────────────────────────────────────────────────────
OPT_AUDITD=1
OPT_AUDIT_IMMUTABLE=1       # Lock rules at boot — requires reboot to change
AUDIT_BUFFER_SIZE=16384

# ── IDS / IPS ────────────────────────────────────────────────────────────────
OPT_IDS=1
OPT_FAIL2BAN=1
OPT_SURICATA=1
FAIL2BAN_MAX_RETRY=3
FAIL2BAN_BAN_TIME=3600

# ── Malware & rootkit detection ──────────────────────────────────────────────
OPT_MALWARE=1
OPT_CLAMAV=1
OPT_RKHUNTER=1
OPT_CHKROOTKIT=1
OPT_YARA=1

# ── File integrity ───────────────────────────────────────────────────────────
OPT_INTEGRITY=1
OPT_AIDE=1

# ── Logging ──────────────────────────────────────────────────────────────────
OPT_LOGGING=1
OPT_PROCESS_ACCOUNTING=1

# ── Automatic updates ────────────────────────────────────────────────────────
OPT_AUTO_UPDATES=1
OPT_AUTO_REBOOT=1           # Servers can reboot during maintenance windows

# ── DNS ──────────────────────────────────────────────────────────────────────
OPT_DNS=1

# ── Service hardening ────────────────────────────────────────────────────────
OPT_DISABLE_SERVICES=1
OPT_DISABLE_CUPS=1
OPT_DISABLE_AVAHI=1
OPT_DISABLE_BLUETOOTH=1
OPT_DISABLE_RPCBIND=1
OPT_DISABLE_NFS=1
OPT_DISABLE_SMB=1

# ── MAC / sandboxing ─────────────────────────────────────────────────────────
OPT_FIREJAIL=1
OPT_FIREJAIL_STEAM=0
OPT_FIREJAIL_BROWSERS=0     # No browser expected on a server
OPT_SELINUX=1               # Enable SELinux if kernel supports it

# ── Misc ─────────────────────────────────────────────────────────────────────
OPT_BANNERS=1
OPT_RESTRICT_COMPILERS=1
OPT_SHARED_MEMORY_HARDEN=1
OPT_FILE_PERMISSIONS=1
OPT_LYNIS=1
OPT_HARDN_TUI=0             # Headless servers unlikely to use TUI; enable if needed
