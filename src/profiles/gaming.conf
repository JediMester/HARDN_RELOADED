# profiles/gaming.conf — Daily Driver / Gaming profile
# Full security stack without breaking Steam, Proton, Wine, controllers, or
# any typical daily-use feature. Designed for Arch (and similar) gaming rigs.

PROFILE_NAME="Daily Driver / Gaming"

# ── Kernel & sysctl ─────────────────────────────────────────────────────────
OPT_KERNEL_HARDEN=1
OPT_DISABLE_IPV6=0          # Many games and services require IPv6
OPT_ASLR=1
OPT_BPF_HARDEN=1
OPT_KPTR_RESTRICT=1
OPT_DMESG_RESTRICT=1
OPT_PERF_RESTRICT=1
OPT_TCP_HARDENING=1
OPT_ICMP_HARDENING=1

# ── Kernel module blacklisting ───────────────────────────────────────────────
OPT_MODULE_BLACKLIST=1
OPT_BLACKLIST_USB_STORAGE=0     # USB drives, USB controllers, capture cards
OPT_BLACKLIST_FIREWIRE=1
OPT_BLACKLIST_RARE_PROTOCOLS=1
OPT_DISABLE_BINFMT_MISC=0       # Required by Proton / Wine for Windows .exe
OPT_BLACKLIST_THUNDERBOLT=0     # Thunderbolt eGPUs and docks

# ── Firewall & dynamic scanner blocker ──────────────────────────────────────
OPT_FIREWALL=1
OPT_DFR_FWD=1
OPT_ALLOW_STEAM_PORTS=1         # Open Steam's required UDP/TCP port ranges
OPT_ALLOW_GAME_PORTS=1          # Generic game port ranges
FIREWALL_ALLOW_HTTP=1
FIREWALL_ALLOW_HTTPS=1
FIREWALL_ALLOW_SSH=1

# Steam ports opened in the firewall module when this flag is set:
#   TCP: 27015-27050, 27036
#   UDP: 27000-27100, 4380, 3478, 4379, 4380

# ── SSH ──────────────────────────────────────────────────────────────────────
OPT_SSH_HARDEN=1
SSH_PERMIT_ROOT_LOGIN="prohibit-password"
SSH_PASSWORD_AUTH="yes"
SSH_X11_FORWARDING="no"
SSH_MAX_AUTH_TRIES=5
SSH_LOGIN_GRACE_TIME=60
SSH_CLIENT_ALIVE_INTERVAL=300
SSH_CLIENT_ALIVE_COUNT_MAX=2
SSH_MAX_SESSIONS=6

# ── PAM / auth ───────────────────────────────────────────────────────────────
OPT_PAM_PWQUALITY=1
OPT_DISABLE_CORE_DUMPS=1
PAM_MIN_PASSWORD_LEN=10
PAM_PASSWORD_RETRY=5

# ── Audit ────────────────────────────────────────────────────────────────────
OPT_AUDITD=1
OPT_AUDIT_IMMUTABLE=1
AUDIT_BUFFER_SIZE=8192

# ── IDS / IPS ────────────────────────────────────────────────────────────────
OPT_IDS=1
OPT_FAIL2BAN=1
OPT_SURICATA=1
FAIL2BAN_MAX_RETRY=5
FAIL2BAN_BAN_TIME=900

# ── Malware & rootkit detection ──────────────────────────────────────────────
OPT_MALWARE=1
OPT_CLAMAV=1
OPT_RKHUNTER=1
OPT_CHKROOTKIT=1
OPT_YARA=1

# ── File integrity ───────────────────────────────────────────────────────────
OPT_INTEGRITY=1
OPT_AIDE=1

# ── Logging ──────────────────────────────────────────────────────────────────
OPT_LOGGING=1
OPT_PROCESS_ACCOUNTING=1

# ── Automatic updates ────────────────────────────────────────────────────────
OPT_AUTO_UPDATES=1
OPT_AUTO_REBOOT=0           # Never auto-reboot mid-session on a gaming rig

# ── DNS ──────────────────────────────────────────────────────────────────────
OPT_DNS=1

# ── Service hardening ────────────────────────────────────────────────────────
OPT_DISABLE_SERVICES=1
OPT_DISABLE_CUPS=0          # Keep printing
OPT_DISABLE_AVAHI=0     # kept: used by cups, pipewire, and Hyprland device discovery on LAN
OPT_DISABLE_BLUETOOTH=0     # Controllers, headsets, peripherals
OPT_DISABLE_RPCBIND=1
OPT_DISABLE_NFS=1
OPT_DISABLE_SMB=0           # May be needed for LAN game shares

# ── MAC / sandboxing ─────────────────────────────────────────────────────────
OPT_FIREJAIL=1
OPT_FIREJAIL_STEAM=1        # Sandbox Steam via Firejail (still fully functional)
OPT_FIREJAIL_BROWSERS=1     # Sandbox all detected browsers
OPT_SELINUX=1               # Enable if kernel supports it, warn if not

# ── Misc ─────────────────────────────────────────────────────────────────────
OPT_BANNERS=1
OPT_RESTRICT_COMPILERS=0    # Allow modding tools, game engines, dev work
OPT_SHARED_MEMORY_HARDEN=1
OPT_FILE_PERMISSIONS=1
OPT_LYNIS=1
